services:
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: inventory-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Inventory123!"

    ports:
      - "1433:1433"

    volumes:
      - inventory_data:/var/opt/mssql

volumes:
  inventory_data: